services:
  php:
    build:
      context: ./php
      extra_hosts:
        - "pecl.php.net:138.199.24.219"
        - "pecl-internal-php-net.b-cdn.net:138.199.24.219"
    container_name: ${COMPOSE_PROJECT_NAME}_php
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Teruskan variabel PROJECT_NAME ke dalam kontainer
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
      - XDEBUG=${XDEBUG:-false}
    volumes:
      - ./src:/var/www/html
      # Konfigurasi PHP & PHP-FPM dibaca langsung dari repo (tanpa rebuild image).
      - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./php/fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
      - ./php/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
  nginx:
    build:
      context: ./nginx
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --fail --insecure --header 'Host: isoc.test' https://127.0.0.1/up > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  # Cache & session di memori (sebelumnya tabel database: setiap request menulis ke MariaDB).
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis
    restart: unless-stopped
    # Snapshot berkala ke disk agar sesi login tetap ada setelah Redis di-restart.
    command: ["redis-server", "--save", "60", "100", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - ./db/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  db:
    image: mariadb:10.11
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "13306:3306"
    environment:
      # Database ini akan dibuat saat kontainer pertama kali dijalankan
      MYSQL_DATABASE: ${PROJECT_NAME}
      MYSQL_ROOT_PASSWORD: p455w0rd
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/data:/var/lib/mysql
