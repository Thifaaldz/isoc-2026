# Lokal (isoc.test): redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name isoc.test;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# Server (di belakang reverse proxy / port HTTP, mis. 8484): layani aplikasi langsung lewat HTTP.
# HTTPS ditangani reverse proxy di depannya, yang meneruskan X-Forwarded-Proto.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/isoc-app.conf;
}

# HTTPS server (lokal, sertifikat self-signed isoc.test)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2: banyak aset (CSS/JS/gambar) dimuat paralel lewat satu koneksi.
    http2 on;

    server_name isoc.test;

    ssl_certificate     /etc/nginx/ssl/isoc.test.crt;
    ssl_certificate_key /etc/nginx/ssl/isoc.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Pakai ulang sesi TLS agar handshake tidak diulang di setiap koneksi.
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1h;

    include /etc/nginx/snippets/isoc-app.conf;
}
