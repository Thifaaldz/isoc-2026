# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name isoc.test;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_tokens off;
    client_max_body_size 0;
    client_body_timeout 3600s;
    client_header_timeout 3600s;

    server_name isoc.test;
    root /var/www/html/public;

    index index.php index.html;

    ssl_certificate     /etc/nginx/ssl/isoc.test.crt;
    ssl_certificate_key /etc/nginx/ssl/isoc.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Header keamanan (berlaku untuk semua respons; diulang di location yang punya add_header sendiri).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Kompresi respons teks (HTML, CSS, JS, JSON, SVG).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset statis (berversi lewat query ?v= atau hash nama file) di-cache browser.
    location ~* ^/(build|css|js|fonts|images|certificate-templates)/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # File unggahan (materi PDF/video, bukti, logo): cache singkat, mendukung range request untuk video.
    location ^~ /storage/ {
        location ~* \.(svg|svgz|html?|xhtml|xml)$ {
            add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            try_files $uri =404;
        }
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }


    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
    }

    location ~ /\.ht {
        deny all;
    }
}
