; Tuning PHP-FPM untuk ±200+ pengguna login bersamaan (di-mount sebagai zz-tuning.conf, dibaca terakhir).
; Satu worker Filament ±50-80 MB; sesuaikan pm.max_children dengan RAM server:
;   max_children ≈ (RAM untuk PHP) / 80 MB. Contoh: 2,5 GB untuk PHP -> 30 worker.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 12
pm.max_requests = 500
; Hentikan request yang macet (download ZIP e-sertifikat sudah menaikkan batas waktunya sendiri).
request_terminate_timeout = 600
pm.status_path = /fpm-status
