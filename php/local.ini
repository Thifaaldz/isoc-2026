date.timezone = "Asia/Jakarta"
upload_max_filesize=0
post_max_size=0
max_execution_time = 120
max_input_time = -1
; Batas per request agar satu request tidak menghabiskan RAM server (sebelumnya -1 / tanpa batas).
memory_limit = 512M
max_file_uploads = 100
expose_php = Off

; OPcache: kode PHP dikompilasi sekali lalu dipakai ulang semua worker.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; Development: cek perubahan file tiap 2 detik. Produksi: set 0 lalu restart php setelah deploy.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096K
realpath_cache_ttl = 600
